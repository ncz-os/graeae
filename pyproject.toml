[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mnemos-graeae"
version = "0.1.0"
description = "GRAEAE multi-muse consult engine — extracted from mnemos monorepo (namespace pkg on mnemos-core)"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "MNEMOS Contributors" }]
maintainers = [{ name = "Jason Perlow", email = "jperlow@gmail.com" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["mnemos-core>=6.2,<7", "httpx"]

[project.optional-dependencies]
test = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
]

[tool.setuptools.packages.find]
include = ["mnemos*"]
namespaces = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
